# Climate scenarios configuration
# Used by apply_climate_delta_batch.py, val_vs_isd_v2.py, and other scripts

scenarios:
  # CORDEX-CMIP5 scenarios
  CORDEX_CMIP5_REMO2015_rcp85:
    variant_root: data/CORDEX_CMIP5/NAM-22_REMO2015_r1i1p1
    gcm: MPI-ESM-LR
    rcm: REMO2015

  CORDEX_CMIP5_RegCM_rcp85:
    variant_root: data/CORDEX_CMIP5/NAM-22_RegCM_r1i1p1
    gcm: MPI-ESM-LR
    rcm: RegCM

  # CMIP5 scenario (GCM only, no RCM)
  CMIP5_rcp85:
    cmip5_base_path: data/CMIP5_merged
    gcm: MPI-ESM-LR
    rcm: null

  # CMIP6 scenario (GCM only, no RCM)
  CMIP6_ssp245:
    cmip6_base_path: data/CMIP6
    gcm: MPI-ESM1-2-LR
    rcm: null

  # CMIP6 scenario for multi-baseline comparison (CNRM-ESM-2-1 GCM)
  CMIP6_CNRM_ssp245:
    cmip6_base_path: data/CMIP6
    gcm: CNRM-ESM-2-1
    rcm: null

  # CORDEX-CMIP6 scenario
  CORDEX_CMIP6_CRCM5_ssp245:
    cordex_base_path: data/CORDEX_CMIP6
    cmip6_base_path: data/CMIP6
    gcm: MPI-ESM1-2-LR
    rcm: CRCM5

# Baseline period configuration
baseline:
  start_year: 1991
  end_year: 2010

# Full history training configuration
# The forecast_to_2100_v5_fixed_baseline.py script automatically uses all data with year <= 2010 for training
# This configuration controls which ISD data source to use:
# - enabled: true  -> uses full historical ISD data (earliest available year ~ 2010)
# - enabled: false -> uses baseline-only ISD data (1991 ~ 2010)
# Note: To switch between full history and baseline-only training without modifying the forecast script,
#       you need to prepare two separate ISD data directories
full_history:
  enabled: true
  isd_dir: "data/ISD_complete_solar"  # Full history: contains data from earliest year to 2024
  # isd_dir: "data/ISD_baseline_only"  # Baseline only: contains data from 1991 to 2020

# Validation period configuration
validation:
  start_date: "2011-01-01"
  end_date: "2020-12-31"

# City timezone mapping (for UTC to LST conversion)
city_timezones:
  Los Angeles: America/Los_Angeles
  Los_Angeles: America/Los_Angeles
  Miami: America/New_York
  Toronto: America/Toronto
  Montreal: America/Montreal
  Phoenix: America/Phoenix
  Chicago: America/Chicago
  New York: America/New_York
  New_York: America/New_York

